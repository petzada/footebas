# Gates locais leves: pre-commit só nos arquivos em stage; pre-push só o typecheck incremental
# dos pacotes que o branch afeta (turbo --affected contra o merge-base com origin/main).
# Testes relacionados ficam em `pnpm test:related` (rodar antes de abrir PR). Lint tipado,
# suíte completa, build, smoke, bundle e E2E ficam no CI.

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,css,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    # Lint sem tipos (~1 s no repo inteiro); o ESLint tipado roda no CI.
    - name: lint
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: pnpm exec oxlint {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: node scripts/affected.mjs typecheck
