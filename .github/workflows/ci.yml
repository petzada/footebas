name: ci

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: tirar o PR de draft dispara os jobs.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Turbo Remote Cache (Vercel, gratuito): o CI publica o build dos pacotes e o pre-push local
# baixa em vez de recompilar. Sem o secret TURBO_TOKEN e a variable TURBO_TEAM, só cache local.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

# Push novo no mesmo PR cancela o run anterior; push na main nunca é cancelado.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# PR em draft não roda CI (os gates locais do lefthook cobrem o diff); roda quando o PR fica
# pronto, no push da main e no Run workflow. `verify` e `e2e` são os checks obrigatórios da
# main: não renomeie.
jobs:
  # Formatação, typecheck, lint tipado, build, smoke e bundle.
  static:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm smoke
      # Linha de base de tamanho do bundle (docs/10-latencia-e-escala.md, Onda 0).
      - name: Tamanho do bundle do web
        run: node tools/bundle-report.mjs apps/web/.next/static >> "$GITHUB_STEP_SUMMARY"
      - name: Análise do bundle (Turbopack)
        continue-on-error: true
        run: pnpm --filter @footebas/web exec next experimental-analyze --output
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle-analysis
          path: apps/web/.next/diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Aviso de falha
        if: failure()
        run: echo "::error title=ci/static::Formatação, typecheck, lint, build ou smoke falhou em ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."

  # Suíte completa do vitest (inclui os Monte Carlo do engine).
  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci
      - name: Aviso de falha
        if: failure()
        run: echo "::error title=ci/test::Testes falharam em ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."

  # Check obrigatório: agrega static e test, equivalente ao antigo `pnpm check`.
  verify:
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    needs: [static, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: static e test verdes
        env:
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "static=$STATIC test=$TEST"
          if [ "$STATIC" != "success" ] || [ "$TEST" != "success" ]; then
            echo "::error title=ci/verify::static=$STATIC test=$TEST"
            exit 1
          fi

  # Playwright (Chromium) contra o web em modo dev com a API Fastify em memória
  # (tools/e2e/playwright.config.ts sobe os dois servidores). Roda em paralelo aos outros.
  e2e:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dos pacotes usados pela API local
        run: pnpm exec turbo run build --filter="@footebas/api^..."
      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @footebas/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @footebas/e2e exec playwright install --with-deps chromium
      - name: Dependências de sistema do Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @footebas/e2e exec playwright install-deps chromium
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-dev-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-dev-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tools/e2e/dist/
          retention-days: 14
      - name: Aviso de falha
        if: failure()
        run: echo "::error title=ci/e2e::E2E falhou em ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
