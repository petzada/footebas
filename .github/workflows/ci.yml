name: ci

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: tirar o PR de draft dispara os jobs pesados.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Push novo no mesmo PR cancela o run anterior.
# Turbo Remote Cache (Vercel, gratuito): o CI publica o build dos pacotes e o
# pre-push local baixa em vez de recompilar. Sem os valores, só cache local.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Repositório privado: PR em draft não roda CI (os gates locais do lefthook cobrem o diff);
# o CI completo roda quando o PR fica pronto, no push da main e no Run workflow.
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Linha de base de tamanho do bundle (docs/10-latencia-e-escala.md, Onda 0).
      - name: Tamanho do bundle do web
        run: node tools/bundle-report.mjs apps/web/.next/static >> "$GITHUB_STEP_SUMMARY"
      - name: Análise do bundle (Turbopack)
        continue-on-error: true
        run: pnpm --filter @footebas/web exec next experimental-analyze --output
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle-analysis
          path: apps/web/.next/diagnostics/
          if-no-files-found: warn
          retention-days: 14

  # Playwright (Chromium) contra o web em modo dev com a API Fastify em memória
  # (tools/e2e/playwright.config.ts sobe os dois servidores). Roda em paralelo
  # ao verify.
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dos pacotes usados pela API local
        run: pnpm exec turbo run build --filter="@footebas/api^..."
      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @footebas/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @footebas/e2e exec playwright install --with-deps chromium
      - name: Dependências de sistema do Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @footebas/e2e exec playwright install-deps chromium
      - run: pnpm e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tools/e2e/dist/
          retention-days: 14
