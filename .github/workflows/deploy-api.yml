name: deploy-api

# Publica o Worker `footebas-api` (apps/api/wrangler.jsonc) depois do CI verde num push na
# main que toque a API ou os pacotes de que ela depende. Sem o secret CLOUDFLARE_API_TOKEN ou
# a variable CLOUDFLARE_ACCOUNT_ID o workflow falha. Deploy só pelo CI (AGENTS.md).
#
# Secrets do Worker (SMOKE_TOKEN, ABACATEPAY_*) ficam no Cloudflare, não aqui; o
# `wrangler deploy` preserva os já configurados.

# Deploy só depois do CI verde: dispara quando o workflow `ci` termina com sucesso num push
# na main (ou pelo Run workflow). O filtro de caminhos roda no job `gate`.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  # Decide se publica: o commit mexeu no api e os secrets do Cloudflare existem. Sem secret o
  # workflow FALHA (nada é publicado em silêncio).
  gate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Mudou algo que afeta o api?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "workflow_dispatch" ] && git diff --quiet HEAD~1 HEAD -- 'apps/api/' 'packages/' 'pnpm-lock.yaml' '.github/workflows/deploy-api.yml'; then
            echo "::notice::Nada que afete o api neste commit; deploy pulado."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exigir CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID
        if: steps.changes.outputs.deploy == 'true'
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing secret CLOUDFLARE_API_TOKEN;"
          [ -n "$ACCOUNT_ID" ] || missing="$missing variable CLOUDFLARE_ACCOUNT_ID;"
          if [ -n "$missing" ]; then
            echo "::error title=deploy-api::Nada foi publicado. Cadastre em Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O wrangler empacota apps/api/src/worker.ts; os pacotes do workspace precisam do dist.
      - run: pnpm exec turbo run build --filter="@footebas/api^..."
      - name: Validar o bundle do Worker
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/api-bundle" --config apps/api/wrangler.jsonc
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config apps/api/wrangler.jsonc --message "${{ needs.gate.outputs.sha }}"
      - name: Smoke (/health)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "https://api.footebas.com.br/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::/health não respondeu 2xx depois do deploy"; exit 1
