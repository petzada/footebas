name: deploy-web

# Builda o web Next.js para Cloudflare Workers com OpenNext no Linux (o build cria symlinks
# que o Windows recusa sem Developer Mode) e publica. Deploy só pelo CI (AGENTS.md): o secret
# CLOUDFLARE_API_TOKEN e as variables CLOUDFLARE_ACCOUNT_ID e NEXT_PUBLIC_SUPABASE_ANON_KEY
# ficam em Settings do repositório; sem eles o workflow falha. O bundle fica como artefato.
# A API tem o seu próprio workflow (deploy-api.yml).

# Deploy só depois do CI verde: dispara quando o workflow `ci` termina com sucesso num push
# na main (ou pelo Run workflow na main). O job `gate` publica só a ponta da main.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  # Decide se publica: o commit é a ponta da main e os secrets do Cloudflare existem. Sem secret o
  # workflow FALHA (nada é publicado em silêncio).
  gate:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Mudou algo que afeta o web?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Sempre publica a ponta da main depois do CI verde (deploy idempotente). Sem filtro de
          # caminhos: com ele, um merge que só mexe em docs fazia o deploy de um merge anterior
          # (CI cancelado ou instável) nunca sair. Re-run de commit velho não publica.
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$sha" ]; then
            echo "::warning::$sha não é a ponta da main ($tip); deploy pulado."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exigir CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID
        if: steps.changes.outputs.deploy == 'true'
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing secret CLOUDFLARE_API_TOKEN;"
          [ -n "$ACCOUNT_ID" ] || missing="$missing variable CLOUDFLARE_ACCOUNT_ID;"
          if [ -n "$missing" ]; then
            echo "::error title=deploy-web::Nada foi publicado. Cadastre em Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.footebas.com.br' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://wjisqiiwsuykfbmqglfb.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_AUTH_MODE: supabase
      # Turbo Remote Cache (Vercel, gratuito): reaproveita o build dos pacotes entre
      # runs e com o pre-push local. Sem os valores, o turbo só usa o cache local.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the public Supabase key
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina a variável NEXT_PUBLIC_SUPABASE_ANON_KEY no repositório (Settings > Variables)."
            exit 1
          fi
      - run: pnpm turbo run build --filter=@footebas/web^...
      - run: pnpm --filter @footebas/web cf:build
      - uses: actions/upload-artifact@v4
        with:
          name: footebas-web-open-next
          path: apps/web/.open-next
          include-hidden-files: true
          retention-days: 7
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy
