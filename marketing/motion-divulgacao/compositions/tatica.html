  <script>
    (() => {
      const T0 = PLANO.inicio.tatica;
      const at = (abs) => abs - T0;
      const C = PLANO.cliques;
      const tl = gsap.timeline({ paused: true });
      const IR = { immediateRender: false };
      FB.mountSprites(document.getElementById('tatica-kid'));
      FB.mountSprites(document.getElementById('tatica-subboard'));

      /* --- Tokens on the chalk board: 4-4-2 -> (Ofensiva) -> 4-3-3. --- */
      const W = 540, H = 660, OX = 30, OY = 30;
      const P = (nx, ny) => [OX + nx * W, OY + ny * H];
      const players = [
        { n: 1, a: [0.5, 0.92], b: [0.5, 0.9], c: [0.5, 0.9] },
        { n: 2, a: [0.86, 0.76], b: [0.86, 0.72], c: [0.86, 0.7] },
        { n: 3, a: [0.62, 0.79], b: [0.62, 0.75], c: [0.63, 0.74] },
        { n: 4, a: [0.38, 0.79], b: [0.38, 0.75], c: [0.37, 0.74] },
        { n: 6, a: [0.14, 0.76], b: [0.14, 0.72], c: [0.14, 0.7] },
        { n: 7, a: [0.86, 0.52], b: [0.86, 0.47], c: [0.84, 0.2] },
        { n: 5, a: [0.62, 0.55], b: [0.62, 0.5], c: [0.5, 0.456] },
        { n: 8, a: [0.38, 0.55], b: [0.38, 0.5], c: [0.26, 0.4] },
        { n: 11, a: [0.14, 0.52], b: [0.14, 0.47], c: [0.16, 0.2] },
        { n: 9, a: [0.38, 0.27], b: [0.38, 0.22], c: [0.5, 0.15] },
        { n: 10, a: [0.62, 0.27], b: [0.62, 0.22], c: [0.74, 0.4] },
      ];
      const box = document.getElementById('tatica-tokens');
      const tokens = {};
      players.forEach((p, i) => {
        const el = document.createElement('div');
        el.className = 'tatica-token';
        el.id = `tatica-t${p.n}`;
        el.innerHTML = `<img src="assets/avatars/atleta-${String(i + 1).padStart(2, '0')}.svg" alt=""><b data-layout-ignore>${p.n}</b>`;
        box.appendChild(el);
        tokens[p.n] = el;
        const [x, y] = P(...p.a);
        gsap.set(el, { x, y });
      });
      const kid = document.createElement('div');
      kid.className = 'tatica-token';
      kid.id = 'tatica-t19';
      kid.innerHTML = '<img src="assets/avatars/garoto-da-base.svg" alt=""><b data-layout-ignore>19</b>';
      box.appendChild(kid);
      const kidXY = P(0.5, 0.456);
      gsap.set(kid, { x: kidXY[0], y: kidXY[1], scale: 0, opacity: 0 });

      /* --- Page enters from below (the app page scrolls over fixed grass). --- */
      tl.fromTo('#tatica-page', { y: 1180 }, { y: 0, duration: 0.5, ease: 'power3.out' }, at(2.22));
      document.querySelectorAll('#tatica-setas path').forEach((path) => {
        const len = Math.ceil(path.getTotalLength());
        gsap.set(path, { strokeDasharray: len, strokeDashoffset: len, attr: { 'data-len': len } });
      });

      /* --- Click 1: OFENSIVA. The green pill slides (layoutId spring). --- */
      const L = FB.springs.layout;
      tl.fromTo('#tatica-pill-m', { x: 0 }, { x: 292, duration: L.duration, ease: L.ease, immediateRender: false }, at(C.ofensiva.t));
      tl.fromTo('#tatica-equi', { color: '#f4efe2' }, { color: '#15201a', duration: 1 / 30, ease: 'steps(1)', immediateRender: false }, at(C.ofensiva.t + 0.06));
      tl.fromTo('#tatica-ofen', { color: '#15201a' }, { color: '#f4efe2', duration: 1 / 30, ease: 'steps(1)', immediateRender: false }, at(C.ofensiva.t + 0.12));
      // The whole team steps up (higher lines), with a 1-frame stagger.
      players.forEach((p, i) => {
        const [x0, y0] = P(...p.a);
        const [x1, y1] = P(...p.b);
        tl.fromTo(tokens[p.n], { x: x0, y: y0 }, { x: x1, y: y1, duration: L.duration, ease: L.ease, immediateRender: false }, at(C.ofensiva.t + 0.05 + i / 30));
      });
      // Chalk arrows draw forward.
      document.querySelectorAll('#tatica-setas path').forEach((path, i) => {
        const len = Number(path.getAttribute('data-len'));
        tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.32, ease: 'power2.out', immediateRender: false }, at(C.ofensiva.t + 0.04 + (i * 2) / 30));
      });

      /* --- Click 2: 4-3-3. Tokens re-form with the layout spring. --- */
      tl.fromTo('#tatica-pill-f', { x: 0 }, { x: 292, duration: L.duration, ease: L.ease, immediateRender: false }, at(C.f433.t));
      tl.fromTo('#tatica-f442', { color: '#f4efe2' }, { color: '#15201a', duration: 1 / 30, ease: 'steps(1)', immediateRender: false }, at(C.f433.t + 0.06));
      tl.fromTo('#tatica-f433', { color: '#15201a' }, { color: '#f4efe2', duration: 1 / 30, ease: 'steps(1)', immediateRender: false }, at(C.f433.t + 0.1));
      players.forEach((p, i) => {
        const [x1, y1] = P(...p.b);
        const [x2, y2] = P(...p.c);
        if (x1 === x2 && y1 === y2) return;
        tl.fromTo(tokens[p.n], { x: x1, y: y1 }, { x: x2, y: y2, duration: L.duration, ease: L.ease, immediateRender: false }, at(C.f433.t + 0.04 + (i % 6) / 30));
      });
      tl.fromTo('#tatica-setas', { opacity: 1 }, { opacity: 0, duration: 0.2, ease: 'power1.in', immediateRender: false }, at(C.f433.t + 0.1));

      /* --- The kid's sticker card rises over the prancheta (pop spring). --- */
      const POP = FB.springs.pop;
      tl.fromTo('#tatica-kidwrap', { y: 1050, rotation: 4 }, { y: 0, rotation: -1.5, duration: POP.duration, ease: POP.ease }, at(4.0));
      tl.fromTo('#tatica-card', { opacity: 1 }, { opacity: 0.35, duration: 0.3, ease: 'power1.out', immediateRender: false }, at(4.1));

      /* --- Drag: grabbed at the avatar, carried in an arc to the 5's slot,
             shrinking into a token (card -> token morph). --- */
      const g = C.pegaGaroto, d = C.soltaGaroto;
      const dragStart = g.t + 0.06, dragDur = d.t - 0.1 - dragStart;
      tl.fromTo('#tatica-kidlift', { scale: 1, rotation: 0 }, { scale: 1.04, rotation: 1.5, duration: 0.12, ease: 'power2.out', immediateRender: false }, at(g.t - 0.04));
      tl.fromTo('#tatica-kidmove', { x: 0 }, { x: d.x - g.x, duration: dragDur, ease: 'power3.inOut', immediateRender: false }, at(dragStart));
      tl.fromTo('#tatica-kidmove', { y: 0 }, { y: d.y - g.y, duration: dragDur, ease: 'power3.inOut', immediateRender: false }, at(dragStart));
      const arc = PLANO.arcoArraste;
      tl.fromTo('#tatica-kidarc', { y: 0 }, { y: arc, duration: dragDur / 2, ease: 'sine.out', immediateRender: false }, at(dragStart));
      tl.fromTo('#tatica-kidarc', { y: arc }, { y: 0, duration: dragDur / 2, ease: 'sine.in', immediateRender: false }, at(dragStart + dragDur / 2));
      tl.fromTo('#tatica-kidwrap', { scale: 1 }, { scale: 0.1, duration: dragDur, ease: 'power2.in', immediateRender: false }, at(dragStart));
      tl.fromTo('#tatica-kidwrap', { rotation: -1.5 }, { rotation: 0, duration: dragDur, ease: 'power2.inOut', immediateRender: false }, at(dragStart));
      tl.fromTo('#tatica-kidwrap', { opacity: 1 }, { opacity: 0, duration: 2 / 30, ease: 'steps(1)', immediateRender: false }, at(d.t));
      tl.fromTo('#tatica-card', { opacity: 0.35 }, { opacity: 1, duration: 0.25, ease: 'power1.out', immediateRender: false }, at(d.t));
      // Out goes the 5, in comes the 19 (pop spring on scale only).
      const [x5, y5] = P(0.5, 0.456);
