  <script>
    (() => {
      const T0 = PLANO.inicio.tabela;
      const at = (abs) => abs - T0;
      const tl = gsap.timeline({ paused: true });
      const IR = { immediateRender: false };
      FB.mountIcons(document.querySelector('#tabela-cam'));

      /* Illustrative end of season, rounds 35 -> 38 (points stay coherent:
         3 V + E = Pts, D = J - V - E). Flamengo climbs 7th -> 1st. */
      const clubs = {
        flamengo: ['Flamengo', 'club_flamengo', [60, 63, 66, 69]],
        palmeiras: ['Palmeiras', 'club_palmeiras', [66, 66, 67, 67]],
        botafogo: ['Botafogo', 'club_botafogo', [64, 65, 65, 68]],
        cruzeiro: ['Cruzeiro', 'club_cruzeiro', [63, 64, 64, 65]],
        saopaulo: ['São Paulo', 'club_sao_paulo', [62, 63, 64, 65]],
        fluminense: ['Fluminense', 'club_fluminense', [62, 62, 63, 64]],
        internacional: ['Internacional', 'club_internacional', [61, 61, 62, 63]],
        bahia: ['Bahia', 'club_bahia', [57, 60, 61, 62]],
        corinthians: ['Corinthians', 'club_corinthians', [55, 56, 59, 60]],
        gremio: ['Grêmio', 'club_gremio', [53, 54, 55, 56]],
      };
      const order = [
        ['palmeiras', 'botafogo', 'cruzeiro', 'fluminense', 'saopaulo', 'internacional', 'flamengo', 'bahia', 'corinthians', 'gremio'],
        ['palmeiras', 'botafogo', 'cruzeiro', 'flamengo', 'saopaulo', 'fluminense', 'internacional', 'bahia', 'corinthians', 'gremio'],
        ['palmeiras', 'flamengo', 'botafogo', 'cruzeiro', 'saopaulo', 'fluminense', 'internacional', 'bahia', 'corinthians', 'gremio'],
        ['flamengo', 'botafogo', 'palmeiras', 'cruzeiro', 'saopaulo', 'fluminense', 'internacional', 'bahia', 'corinthians', 'gremio'],
      ];
      const stats = (pts, r) => {
        const j = 35 + r;
        const e = 6 + (pts % 3);
        const v = (pts - e) / 3;
        const d = j - v - e;
        return { j, v, e, d, sg: Math.round((v - d) * 1.4) };
      };
      const ROW = 78;
      const rowsBox = document.getElementById('tabela-rows');
      const cells = {};
      Object.entries(clubs).forEach(([id, [name, crest, pts]]) => {
        const row = document.createElement('div');
        row.className = 'tabela-row tabela-cols' + (id === 'flamengo' ? ' me' : '');
        row.id = `tabela-r-${id}`;
        const st = stats(pts[0], 0);
        row.innerHTML = `<span class="pos"></span><img src="assets/crests/${crest}.png" alt=""><span class="tabela-name">${name}${id === 'flamengo' ? '<span id="tabela-cup" data-sprite="trophy" data-px="4"></span>' : ''}</span><span class="j">${st.j}</span><span class="v">${st.v}</span><span class="e">${st.e}</span><span class="d">${st.d}</span><span class="sg">${st.sg}</span><span class="pts">${pts[0]}</span>`;
        rowsBox.appendChild(row);
        cells[id] = row;
        const rank = order[0].indexOf(id);
        row.querySelector('.pos').textContent = String(rank + 1);
        gsap.set(row, { y: rank * ROW });
      });
      FB.mountSprites(rowsBox);
      gsap.set('#tabela-cup', { opacity: 0, scale: 0.3 });

      /* 14.0: the phone holds on the Central's table card; the camera dives in
         and the card becomes the full-frame classification. */
      tl.fromTo('#tabela-cam', { scale: 1, y: 0 }, { scale: 4.4, y: -53, duration: 0.5, ease: 'power3.in' }, at(14.05));
      tl.fromTo('#tabela-full', { scale: 0.86 }, { scale: 1, duration: 0.5, ease: 'expo.out', immediateRender: false }, at(14.42));
      tl.fromTo('#tabela-full', { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power1.out', immediateRender: false }, at(14.42));
      tl.fromTo('#tabela-cam', { opacity: 1 }, { opacity: 0, duration: 0.06, ease: 'power1.in', immediateRender: false }, at(14.48));

      /* Three rounds on the beat: rows swap places with the layout spring. */
      const L = FB.springs.layout;
      const steps = [15.0, 15.75, 16.5];
      const sub = document.getElementById('tabela-sub');
      steps.forEach((t, k) => {
        const r = k + 1;
        FB.setText(tl, sub, `Brasileirão Série A · rodada ${34 + r}`, `Brasileirão Série A · rodada ${35 + r}`, at(t));
        Object.entries(clubs).forEach(([id, [, , pts]]) => {
          const row = cells[id];
          const from = order[r - 1].indexOf(id);
          const to = order[r].indexOf(id);
          if (from !== to) tl.fromTo(row, { y: from * ROW }, { y: to * ROW, duration: L.duration, ease: L.ease, immediateRender: false }, at(t));
          FB.setText(tl, row.querySelector('.pos'), String(from + 1), String(to + 1), at(t + 0.12));
          const a = stats(pts[r - 1], r - 1);
          const b = stats(pts[r], r);
          ['j', 'v', 'e', 'd', 'sg'].forEach((c) => FB.setText(tl, row.querySelector('.' + c), String(a[c]), String(b[c]), at(t)));
          FB.setText(tl, row.querySelector('.pts'), String(pts[r - 1]), String(pts[r]), at(t));
          if (pts[r] !== pts[r - 1]) FB.flicker(tl, row.querySelector('.pts'), at(t));
        });
      });
      // First place: the row flashes like a bulb board and the trophy pops.
      FB.flicker(tl, '#tabela-r-flamengo', at(16.62));
      tl.fromTo('#tabela-cup', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: FB.springs.pop.duration, ease: FB.springs.pop.ease, immediateRender: false }, at(16.7));
      // Out at bar 10: a whip to the left into the club.
      tl.fromTo('#tabela-full', { x: 0 }, { x: -2100, duration: 0.3, ease: 'power3.in', immediateRender: false }, at(17.82));
      FB.pixelAccents(document.querySelector('[data-composition-id="tabela"]'));
      window.__timelines['tabela'] = tl;
    })();
  </script>
