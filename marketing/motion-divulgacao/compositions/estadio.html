  <script>
    (() => {
      const T0 = PLANO.inicio.estadio;
      const at = (abs) => abs - T0;
      const C = PLANO.cliques;
      const tl = gsap.timeline({ paused: true });
      const IR = { immediateRender: false };
      const step = (el, from, to, t) => tl.fromTo(el, from, Object.assign({}, to, { duration: 1 / 30, ease: 'steps(1)' }, IR), t);
      FB.mountIcons(document.getElementById('estadio-phone'));
      FB.mountIcons(document.getElementById('estadio-ctrl'));

      // Out of the button's green into the pitch.
      tl.fromTo('#estadio-flash', { opacity: 1 }, { opacity: 0, duration: 0.2, ease: 'power1.out' }, at(7.86));
      // The live board drops in at the second-half whistle.
      FB.springTo(tl, '#estadio-board', { y: -300 }, { y: 0 }, at(8.0), 'ui');

      // The match clock walks; it races while the speed is at 4x.
      const badge = document.getElementById('estadio-badge');
      const clock = (from, to, t, d) => FB.count(tl, badge, from, to, at(t), d, (v) => `Ao vivo · ${Math.round(v)}'`, 'none');
      clock(46, 67, 8.05, 1.9);
      clock(67, 88, 10.9, 0.7);
      clock(88, 90, 12.6, 0.7);
      FB.setText(tl, badge, "Ao vivo · 90'", 'Fim de jogo', at(13.35));

      // Goal 1: 1 x 1 (the game's banner + the bulb digit flickers).
      const away = document.getElementById('estadio-away');
      FB.setText(tl, away, '0', '1', at(10.0));
      FB.flicker(tl, away, at(10.0));
      step('#estadio-n1', { opacity: 1 }, { opacity: 0 }, at(10.0));
      step('#estadio-n2', { opacity: 0 }, { opacity: 1 }, at(10.0));
      tl.fromTo('#estadio-gool1', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.22, ease: 'steps(4)' }, at(10.0));
      step('#estadio-gool1', { opacity: 1 }, { opacity: 0 }, at(10.85));

      // Speed control: the coach taps 4x, then back to 1x for the finish.
      FB.springTo(tl, '#estadio-ctrl', { y: 180 }, { y: 0 }, at(10.42), 'ui');
      const sel = '#estadio-sel';
      tl.fromTo(sel, { x: 0 }, { x: 260, duration: FB.springs.layout.duration, ease: FB.springs.layout.ease, immediateRender: false }, at(C.vel4x.t));
      step('#estadio-t1', { color: '#ffd23f' }, { color: '#f4efe2' }, at(C.vel4x.t + 0.05));
      step('#estadio-t4', { color: '#f4efe2' }, { color: '#ffd23f' }, at(C.vel4x.t + 0.1));
      tl.fromTo(sel, { x: 260 }, { x: 0, duration: FB.springs.layout.duration, ease: FB.springs.layout.ease, immediateRender: false }, at(C.vel1x.t));
      step('#estadio-t4', { color: '#ffd23f' }, { color: '#f4efe2' }, at(C.vel1x.t + 0.05));
      step('#estadio-t1', { color: '#f4efe2' }, { color: '#ffd23f' }, at(C.vel1x.t + 0.1));
      tl.fromTo('#estadio-ctrl', { y: 0 }, { y: 200, duration: 0.22, ease: 'power2.in', immediateRender: false }, at(11.75));

      // Goal 2: 1 x 2 — VIROU!
      FB.setText(tl, away, '1', '2', at(12.0));
      FB.flicker(tl, away, at(12.0));
      step('#estadio-n2', { opacity: 1 }, { opacity: 0 }, at(12.0));
      step('#estadio-n3', { opacity: 0 }, { opacity: 1 }, at(12.0));
      tl.fromTo('#estadio-gool2', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.22, ease: 'steps(4)' }, at(12.0));
      const POP = FB.springs.pop;
      tl.fromTo('#estadio-virou', { scale: 2.4, rotation: -11 }, { scale: 1, rotation: -5, duration: POP.duration, ease: POP.ease }, at(12.1));
      tl.fromTo('#estadio-virou', { opacity: 0 }, { opacity: 1, duration: 2 / 30, ease: 'steps(1)' }, at(12.1));

      // Overlays clear, then the camera pulls back into the phone.
      tl.fromTo(['#estadio-gool2'], { opacity: 1 }, { opacity: 0, duration: 0.1, ease: 'power1.in', immediateRender: false }, at(12.95));
      tl.fromTo('#estadio-virou', { scale: 1, opacity: 1 }, { scale: 0.6, opacity: 0, duration: 0.14, ease: 'power2.in', immediateRender: false }, at(12.95));
      tl.fromTo('#estadio-board', { y: 0 }, { y: -320, duration: 0.2, ease: 'power2.in', immediateRender: false }, at(12.95));
      const s = 407.58 / 1920;
      const back = { duration: 0.6, ease: 'power2.inOut', immediateRender: false };
      tl.fromTo('#estadio-tv', { x: 0, y: 0, scale: 1 }, Object.assign({ x: 756.2, y: 542.7, scale: s }, back), at(13.05));
      tl.fromTo('#estadio-phonewrap', { x: -756.2 / s, y: -60 - 482.7 / s, scale: 1 / s }, Object.assign({ x: 0, y: 0, scale: 1 }, back), at(13.05));
      gsap.set('#estadio-phonewrap', { x: -756.2 / s, y: -60 - 482.7 / s, scale: 1 / s });

      // Final whistle on the phone, then the post-match screen.
      step('#estadio-mbadge', { opacity: 1 }, { opacity: 0 }, at(13.35));
      step('#estadio-mbadge2', { opacity: 0 }, { opacity: 1 }, at(13.35));
      step('#estadio-mpts', { opacity: 0 }, { opacity: 1 }, at(13.35));
      FB.setText(tl, document.getElementById('estadio-mverdict'), 'GOL! O garoto decide.', 'Flamengo venceu', at(13.65));
      step('#estadio-tv', { opacity: 1 }, { opacity: 0 }, at(13.65));
      step('#estadio-mlive', { opacity: 1 }, { opacity: 0 }, at(13.65));
      step('#estadio-mpost', { opacity: 0 }, { opacity: 1 }, at(13.65));
      FB.click(tl, document.createElement('i'), at(C.preparar.t), '#estadio-mprep', 3);

      FB.pixelAccents(document.querySelector('[data-composition-id="estadio"]'));
      window.__timelines['estadio'] = tl;
    })();
  </script>
