      const T0 = PLANO.inicio.clube;
      const at = (abs) => abs - T0;
      const C = PLANO.cliques;
      const tl = gsap.timeline({ paused: true });
      const IR = { immediateRender: false };
      const step = (el, from, to, t) => tl.fromTo(el, from, Object.assign({}, to, { duration: 1 / 30, ease: 'steps(1)' }, IR), t);
      FB.mountSprites(document.querySelector('[data-composition-id="clube"]'));
      FB.mountIcons(document.querySelector('[data-composition-id="clube"]'));
      ['#clube-t1', '#clube-sponsor', '#clube-t4', '#clube-hA', '#clube-hB', '#clube-hC'].forEach((s) => FB.pixelTitle(document.querySelector(s)));

      // Shots on the beat (1 s each): hard cuts inside the montage.
      const shots = ['#clube-s1', '#clube-s2', '#clube-s3', '#clube-s4'];
      const cuts = [18.0, 19.0, 20.0, 21.0];
      shots.forEach((s, i) => {
        step(s, { opacity: 0 }, { opacity: 1 }, at(cuts[i]));
        if (i < shots.length - 1) step(s, { opacity: 1 }, { opacity: 0 }, at(cuts[i + 1]));
      });

      // 1 — arrives on a whip from the table (enters from the right).
      tl.fromTo('#clube-s1', { x: 2100 }, { x: 0, duration: 0.3, ease: 'power3.out' }, at(18.0));
      FB.click(tl, document.createElement('i'), at(C.aceitar.t), '#clube-aceitar', 6);
      step('#clube-tag1', { opacity: 1 }, { opacity: 0 }, at(C.aceitar.t + 0.05));
      step('#clube-tag2', { opacity: 0 }, { opacity: 1 }, at(C.aceitar.t + 0.05));
      FB.count(tl, document.getElementById('clube-patro'), 4.8, 14.3, at(C.aceitar.t + 0.06), 0.4, (v) => `R$ ${v.toFixed(1).replace('.', ',')} mi`, 'power2.out');
      tl.fromTo('#clube-coin', { y: 40, scale: 0.4, opacity: 0 }, { y: -10, scale: 1, opacity: 1, duration: FB.springs.pop.duration, ease: FB.springs.pop.ease }, at(C.aceitar.t + 0.08));

      // 2 — the AI's offer slides in; the coach counter-offers.
      FB.springTo(tl, '#clube-offer', { x: 700 }, { x: 0 }, at(19.02), 'ui');
      FB.click(tl, document.createElement('i'), at(C.proposta.t), '#clube-p-contra', 6);
      step('#clube-otag1', { opacity: 1 }, { opacity: 0 }, at(C.proposta.t + 0.05));
      step('#clube-otag2', { opacity: 0 }, { opacity: 1 }, at(C.proposta.t + 0.05));
      FB.count(tl, document.getElementById('clube-valor'), 48, 55, at(C.proposta.t + 0.06), 0.35, (v) => `R$ ${Math.round(v)} mi`, 'power2.out');

      // 3 — buildings light up on eighth notes (the map's hover lift + focus).
      const areas = ['ct', 'stadium', 'hq', 'press'];
      areas.forEach((a, i) => {
        const t = at(20.05 + i * 0.22);
        const g = document.querySelector('#clube-mapa-box [data-area="' + a + '"]');
        tl.fromTo(g.querySelector('.map-lift'), { y: 0 }, { y: -2, duration: 2 / 30, ease: 'steps(2)', immediateRender: false }, t);
        tl.fromTo(g.querySelector('.map-focus'), { stroke: 'rgba(255,210,63,0)' }, { stroke: 'rgba(255,210,63,1)', duration: 1 / 30, ease: 'steps(1)', immediateRender: false }, t);
        tl.fromTo('#clube-a' + (i + 1), { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: FB.springs.ui.duration, ease: FB.springs.ui.ease }, t);
      });

      // 4 — the pyramid stacks bottom-up: C, B, A; then the cups.
      const U = FB.springs.ui;
      [['#clube-tC', 21.0], ['#clube-uBC', 21.1], ['#clube-tB', 21.15], ['#clube-uAB', 21.25], ['#clube-tA', 21.3]].forEach(([s, t]) => {
        tl.fromTo(s, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: U.duration, ease: U.ease }, at(t));
      });
      ['#clube-cup1', '#clube-cup2', '#clube-cup3'].forEach((s, i) => {
        tl.fromTo(s, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: FB.springs.pop.duration, ease: FB.springs.pop.ease }, at(21.45 + i * 0.1));
      });
      FB.pixelAccents(document.querySelector('[data-composition-id="clube"]'));
      window.__timelines['clube'] = tl;
    })();
  </script>
</template>
